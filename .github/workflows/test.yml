# Unit tests for the job-feed rules on every pull request and push to main.
# The Playwright suite (npm run test:e2e) runs locally: it needs the local job snapshot and API keys.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/
